<html>
<head>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Reproduciendo - Goltra Karaoke</title>
    <style>
        {{stylesheet}}
    </style>
</head>
<body>

<script src="http://www.youtube.com/player_api"></script>

<script>

    // create youtube player
    var player;

    function onYouTubePlayerAPIReady() {
        console.log('window',window);
        player = new YT.Player('player', {
            width: window.innerWidth,
            height: window.innerHeight,
            videoId: '{{video_id}}',
            events: {
                onReady: onPlayerReady,
                onStateChange: onPlayerStateChange
            }
        });
    }

    // autoplay video
    function onPlayerReady(event) {
        setTimeout(() => {
            event.target.playVideo();
        }, 7000);
    }

    // when video ends
    function onPlayerStateChange(event) {
        if (event.data === 0) {
            next();
        }
    }

    function next() {
        const t = Date.now();
        setTimeout(() => {
            window.location.href = '/play?t=' + t;
        }, 3000);
    }

    function speak(text) {
        if (!('speechSynthesis' in window)) {
            console.error('Speech Synthesis API not supported in this browser.');
            return;
        }

        const utterance = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(utterance);

    }

    document.addEventListener('DOMContentLoaded', () => {
        speak('{{textToSpeak}}');
        setTimeout(() => {
            const modal = document.getElementById('capa-modal');
            modal.classList.add('hide');
            setTimeout(() => {
                modal.remove();
            }, 3000);
        }, 5000);
    });
</script>

<div id="capa-modal" class="modal">
    <div class="modal-content">
        <div style="font-size: 4rem; margin-bottom: 20px;">🎤</div>
        <h1>{{textToSpeak}}</h1>
        <p style="margin-top: 15px; font-size: 1.2rem; opacity: 0.9;">¡Que lo disfrutes!</p>
    </div>
</div>

<div id="player"></div>

<div class="div__nextSong">
    <p class="p__nextSong" onclick="next()">
        <span class="material-icons" style="vertical-align: middle; margin-right: 5px;">skip_next</span>
        Siguiente canción
    </p>
</div>


</body>
</html>
