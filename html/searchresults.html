<html>
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="HandheldFriendly" content="true">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Resultados de Búsqueda - Goltra Karaoke</title>
    <style>
        {{stylesheet}}
    </style>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
<header>
   <!-- {{menu}} -->
</header>

<div class="container__mainscreen" style="padding-top: 20px;">
    <h1>🎵 Resultados de Búsqueda</h1>

    <div style="text-align: center; margin: 20px 0;">
        <a class="search_a" href="/">
            <span class="material-icons" style="vertical-align: middle; font-size: 20px;">arrow_back</span>
            Volver a buscar
        </a>
    </div>

    <p class="search_p">
        ¡Hola <strong>{{singer}}</strong>! 👋
        <br>
        Aquí tienes los resultados de tu búsqueda. Pulsa sobre las canciones que quieras añadir a la lista.
    </p>

    <div id="listaCanciones">
        {{videos}}
    </div>
</div>

<script>
    async function add(event) {
        console.log(event)
        event.preventDefault();
        const res = await fetch('/add', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                video_id: event.target.id,
                name: event.target.dataset.name,
                title: event.target.dataset.title
            })
        });
        Toastify({
            text: "🎤 Canción añadida. En breve te avisamos para que subas a cantar!",
            duration: 4000,
            gravity: "top",
            position: "center",
            stopOnFocus: true,
            style: {
                background: "linear-gradient(135deg, #667eea 0%, #764ba2 100%)",
                borderRadius: "12px",
                fontFamily: "'Poppins', sans-serif",
                fontWeight: "500",
                boxShadow: "0 10px 40px rgba(0, 0, 0, 0.5)"
            }
        }).showToast();
    }
</script>
</body>
</html>
