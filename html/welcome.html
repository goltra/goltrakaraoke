<html>
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Goltra Karaoke</title>
    <style>
        {{stylesheet}}
    </style>
</head>

<body>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('frmSearch');
        form.addEventListener('submit', function (event) {
            const title = document.getElementById('title');
            const name = document.getElementById('name');

            if (title.value === '') {
                event.preventDefault();
                alert('El título no puede estar vacío');
                return;
            }
            if (name.value === '') {
                event.preventDefault();
                alert('El nombre no puede estar vacío');
                return;
            }

            document.getElementById('section_loading').style.visibility = 'visible';
            // Permitir el envío normal del formulario
        });
    });

    async function actualizaCantantes() {
        try {
            const response = await fetch('/lista-canciones', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'}
            });

            if (!response.ok) {
                throw new Error('Error en la respuesta');
            }

            const data = await response.json();

            if (data && Array.isArray(data) && data.length > 0) {
                // Filtrar líneas vacías y parsear el formato: fecha\tname\tvideo_id\ttitulo
                const canciones = data
                    .filter(line => line && line.trim() !== '')
                    .map(line => {
                        const parts = line.split('\t');
                        return {
                            singer: parts[1] || 'Sin nombre',
                            title: parts[3] || 'Sin título'
                        };
                    });

                if (canciones.length > 0) {
                    document.getElementById('singersList').innerHTML = canciones.map((cancion, index) => `
                        <li class="cancion">
                            <div class="cancion-number">${index + 1}</div>
                            <div class="cancion-info">
                                <div class="cancion-nombre">${cancion.singer}</div>
                                <div class="cancion-titulo">${cancion.title}</div>
                            </div>
                        </li>
                    `).join('');
                } else {
                    document.getElementById('singersList').innerHTML = `
                        <li class="cancion" style="text-align: center; opacity: 0.7;">
                            <div class="cancion-info">
                                <span class="material-icons" style="font-size: 48px; display: block; margin-bottom: 10px;">queue_music</span>
                                <div class="cancion-titulo">No hay canciones en cola</div>
                            </div>
                        </li>`;
                }
            } else {
                document.getElementById('singersList').innerHTML = `
                    <li class="cancion" style="text-align: center; opacity: 0.7;">
                        <div class="cancion-info">
                            <span class="material-icons" style="font-size: 48px; display: block; margin-bottom: 10px;">queue_music</span>
                            <div class="cancion-titulo">No hay canciones en cola</div>
                        </div>
                    </li>`;
            }
        } catch (error) {
            console.error('Error al obtener la lista de canciones:', error);
            document.getElementById('singersList').innerHTML = `
                <li class="cancion" style="text-align: center; opacity: 0.7;">
                    <div class="cancion-info">
                        <span class="material-icons" style="font-size: 48px; display: block; margin-bottom: 10px;">error_outline</span>
                        <div class="cancion-titulo">Error al cargar canciones</div>
                    </div>
                </li>`;
        }
    }

    let lastSong = null;

    async function actualizoCurrentSong() {
        try {
            const data = await fetch('/getCurrentSong', {method: 'GET'});
            const song = await data.json();

            // Validar que existan las propiedades antes de usar trim()
            const title = (song.title || 'ninguno').trim();
            const singer = (song.singer || 'ninguno').trim();

            // Solo actualizar si hay cambios
            const currentSongKey = `${singer}|${title}`;
            if (lastSong === currentSongKey) {
                return; // No hay cambios, no actualizar
            }
            lastSong = currentSongKey;

            const container = document.getElementById('currentSong');

            if (singer !== 'ninguno' && title !== 'ninguno') {
                container.innerHTML = `
                    <div class="current-song-card">
                        <div class="current-song-icon">
                            <span class="material-icons">music_note</span>
                        </div>
                        <div class="current-song-details">
                            <div class="current-song-label">Sonando ahora</div>
                            <div class="current-song-title">${title}</div>
                            <div class="current-song-singer">🎤 ${singer}</div>
                        </div>
                        <div class="current-song-pulse"></div>
                    </div>`;
            } else {
                container.innerHTML = `
                    <div class="current-song-card empty">
                        <span class="material-icons">music_off</span>
                        <p>No está sonando ninguna canción</p>
                    </div>`;
            }
        } catch (error) {
            console.error('Error al obtener la canción actual:', error);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        actualizaCantantes();
        actualizoCurrentSong();
        setInterval(async () => await actualizaCantantes(), 10000);
        setInterval(async () => await actualizoCurrentSong(), 5000);
    });
</script>

<header>
    <!-- {{menu}} -->
</header>

<div class="container__mainscreen">
    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title animate-title">
                <span class="material-icons hero-icon">mic</span>
                Goltra Karaoke
            </h1>
            <p class="hero-subtitle">¡Encuentra tu canción favorita y canta!</p>
        </div>
    </section>

    <!-- Formulario de Búsqueda -->
    <section class="search-section">
        <form id="frmSearch" method="post" action="/search" class="search-form" style="max-width: 800px; width: 100%;">
            <div class="form-group">
                <label for="name" class="form-label">
                    <span class="material-icons">person</span>
                    Tu nombre
                </label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-input"
                    placeholder="¿Cómo te llamas?"
                    autocomplete="off"
                />
            </div>

            <div class="form-group">
                <label for="title" class="form-label">
                    <span class="material-icons">search</span>
                    Canción
                </label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    class="form-input"
                    placeholder="Busca tu canción favorita..."
                    autocomplete="off"
                />
            </div>

            <button type="submit" class="btn-primary">
                <span class="material-icons">search</span>
                Buscar canción
            </button>
        </form>

        <div id="section_loading" class="loading-overlay">
            <div class="loading-spinner"></div>
            <p>Buscando canciones...</p>
        </div>
    </section>

    <!-- Current Song Card (Flotante) -->
    <div id="currentSong" class="current-song-container" style="margin: 30px 0; padding: 20px; background: rgba(102, 126, 234, 0.1); border-radius: 16px; border: 2px solid rgba(102, 126, 234, 0.3);">
        <div class="current-song-card empty">
            <span class="material-icons">music_off</span>
            <p>No está sonando ninguna canción</p>
        </div>
    </div>

    <!-- Lista de Canciones en Cola -->
    <section class="queue-section">
        <h2 class="section-title">
            <span class="material-icons">queue_music</span>
            Próximas canciones
        </h2>
        <ul id="singersList" class="singers-list">
            <li class="cancion">
                <div class="cancion-info">
                    <div class="cancion-titulo">Cargando...</div>
                </div>
            </li>
        </ul>
    </section>

</div>

</body>
</html>
